name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip AgarzMulti.zip -d .
          find . -name "WebViewFragment.java" | head -5

      - name: Fix User Agent for Redmi
        run: |
          FILE=$(find . -name "WebViewFragment.java" | head -1)
          sed -i 's|s.setUserAgentString(s.getUserAgentString() + " AgarzAcc/" + accountId);|s.setUserAgentString("Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36 AgarzAcc/" + accountId);|g' "$FILE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Build APK
        run: |
          DIR=$(find . -name "gradlew" | head -1 | xargs dirname)
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AgarzMulti-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
